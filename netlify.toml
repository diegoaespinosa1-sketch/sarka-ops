[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"

[build.environment]
  NODE_VERSION = "18"
  # Static HTML site — force Next.js runtime/plugin OFF (UI may still show it until removed)
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_PLUGIN_FORCE_RUN = "false"

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-config"
  to = "/.netlify/functions/stripe-config"
  status = 200
  force = true

[forms]
  # Formspree handles the main contact form
