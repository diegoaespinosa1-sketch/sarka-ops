[build]
  # Static HTML + two functions. `true` is a no-op so a UI "Next.js" build
  # command cannot win. Do not use `npm install` / `next build` here.
  command = "true"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_PLUGIN_FORCE_RUN = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["stripe"]

[dev]
  framework = "#static"
  publish = "."

[[redirects]]
  from = "/api/create-checkout-session"
  to = "/.netlify/functions/create-checkout-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-config"
  to = "/.netlify/functions/stripe-config"
  status = 200
  force = true

[forms]
  # Formspree handles the main contact form
